name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      # The wiki is half this repo's dependencies and went unaudited until a
      # critical advisory turned up in it.
      - run: npm ci
        working-directory: ./website
      - run: npm audit --omit=dev
        working-directory: ./website
